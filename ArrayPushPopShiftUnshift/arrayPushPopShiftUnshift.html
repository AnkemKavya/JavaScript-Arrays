<!DOCTYPE html>
<html>
    <head>
        <title>Array Pop</title>
        <script src="arrayPop.js"></script>
    </head>
    <body>
        <h2>Array Pop</h2>
        <label for="txtWorkType">Work Type</label>
        <input type="text" id="txtWorkType" placeholder="Enter the Type of Work"><br>
        <button onclick="onClickToAdd()">Push</button>
        <div id="divAdd"></div>

        <button onclick="onClickToRemove()">Pop</button>
        <div id="divRemove"></div>

        <button onclick="onClickToUnshift()">Unshift</button>
        <div id="divUnshift"></div>

        <button onclick="onClickToShift()">Shift</button>
        <div id="divShift"></div>
    </body>
</html>
