<!DOCTYPE html>
<html>
    <head>
        <title>Array Slice</title>
        <script src="arraySlice.js"></script>
    </head>
    <body>
        <h2>Array Slice</h2>
        <label for="txtAnimals">Animals</label>
        <input type="text" id="txtAnimals" placeholder="Enter an animal"><br>

        <button onclick="onClickToPush()">Push</button>
        <div id="divPush"></div>

        <button onclick="onClickToPop()">Pop</button>
        <div id="divPop"></div>

        <label for="txtStartIndex">Start Index</label>
        <input type="number" id="txtStartIndex" placeholder="Enter the starting index number">
        <label for="txtEndIndex">End Index</label>
        <input type="number" id="txtEndIndex" placeholder="Enter the Ending index number"><br>

        <button onclick="onClickToSlice()">Slice</button>
        <div id="divSlice"></div>
    </body>
</html>
